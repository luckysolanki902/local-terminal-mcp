[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-terminal-mcp"
version = "0.1.0"
description = "A safe MCP server that lets ChatGPT, Claude and other MCP clients run allowlisted local commands against a codebase."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lucky Solanki" }]
keywords = ["mcp", "model-context-protocol", "chatgpt", "claude", "terminal", "codebase"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "mcp>=2.0.0",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.optional-dependencies]
# Pillow enables read_image auto-downscaling of large images.
images = ["pillow>=10"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "pillow>=10",
]

[project.scripts]
local-terminal-mcp = "local_terminal_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/luckysolanki/local-terminal-mcp"
Issues = "https://github.com/luckysolanki/local-terminal-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/local_terminal_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
